{% extends 'library/base.html' %}

{% block title %}
Add Member
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Add New Member</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Add Member
        </button>

        <a href="{% url 'member_list' %}" class="btn">
            Back to Members
        </a>
    </form>

</div>

{% endblock %}

{% extends 'library/base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="login-container">

    <h1>Library Login</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Login
        </button>
    </form>

</div>

{% endblock %}

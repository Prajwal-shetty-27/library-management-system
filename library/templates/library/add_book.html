{% extends 'library/base.html' %}

{% block title %}
Add Book
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Add New Book</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Add Book
        </button>

        <a href="{% url 'book_list' %}" class="btn">
            Back to Books
        </a>
    </form>

</div>

{% endblock %}

<!DOCTYPE html>
<html>

<head>
    <title>
        {% block title %}
        Library Management System
        {% endblock %}
    </title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'library/style.css' %}">
</head>

<body>

    {% if user.is_authenticated %}

    <nav>
        <h2>Library Management System</h2>

        <div>
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'book_list' %}">Books</a>
            <a href="{% url 'member_list' %}">Members</a>
            <a href="{% url 'borrow_list' %}">Borrowed Books</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </nav>

    {% endif %}


    <main>

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
